#cloud-config
# Mina egress node bootstrap (M1-2 template). Brings up Envoy as the authenticated forward
# CONNECT proxy behind the stamp's load balancer. This is the reproducible, minimal-surface node
# image described in ARCHITECTURE §3.3 and THREAT_MODEL ("egress host compromised" → minimal
# image, rebuildable).
#
# TLS material is NOT baked into the image. In production the node fetches its server certificate
# and the internal CA from Key Vault using the VMSS managed identity (marked TODO below); for the
# M1 lab the certs are provisioned out of band into /etc/mina/tls. The CA private key never
# reaches the node — the node only holds its own server cert + the CA public cert.

write_files:
  - path: /etc/mina/envoy/envoy-bootstrap.yaml
    permissions: "0644"
    # Replaced at provisioning time with egress-node/envoy/envoy-bootstrap.yaml (kept in git).
    content: |
      # placeholder — overwritten by the deployment pipeline with the committed config
  - path: /etc/systemd/system/mina-envoy.service
    permissions: "0644"
    content: |
      [Unit]
      Description=Mina egress Envoy
      After=network-online.target mina-fetch-certs.service
      Requires=mina-fetch-certs.service
      [Service]
      ExecStart=/usr/local/bin/envoy -c /etc/mina/envoy/envoy-bootstrap.yaml --log-level info
      Restart=always
      RestartSec=2
      # Least privilege: no new privileges, read-only system, private tmp.
      DynamicUser=yes
      SupplementaryGroups=mina-tls
      NoNewPrivileges=yes
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      ReadOnlyPaths=/etc/mina
      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/sbin/mina-fetch-certs.sh
    permissions: "0750"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      install -d -m 0750 -g mina-tls /etc/mina/tls
      # TODO(M2): fetch server cert/key + CA public cert from Key Vault via the VMSS managed
      # identity (IMDS token → Key Vault secret). Fail closed: if the fetch fails, do not start
      # Envoy, so the node never serves without a valid, current certificate.
      #   token=$(curl -s -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net")
      #   ... az keyvault secret download ...
      test -s /etc/mina/tls/server.crt
      test -s /etc/mina/tls/server.key
      test -s /etc/mina/tls/ca.crt

runcmd:
  - [ groupadd, -f, mina-tls ]
  # TODO(M1-2): install a pinned Envoy build (checksum-verified) from the approved source, or
  #   bake it into a hardened custom image built in the pipeline. Placeholder uses func-e.
  # - curl -fsSL https://func-e.io/install.sh | bash -s -- -b /usr/local/bin && func-e use 1.39.1
  - [ /usr/local/sbin/mina-fetch-certs.sh ]
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, mina-envoy.service ]

# The Wazuh agent and the telemetry sidecar (allowlist sync + hostname-log shipping) are added
# here in M2-3/M3-4.
